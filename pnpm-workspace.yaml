allowBuilds:
  # Sass uses its JS API; its optional native watcher is not needed.
  '@parcel/watcher': false
minimumReleaseAgeExclude:
  - '@kitschpatrol/chagent@0.6.0'
peerDependencyRules:
  allowedVersions:
    # Remove once the installed version declares ESLint 10 support.
    # https://github.com/jsx-eslint/eslint-plugin-jsx-a11y/issues/1075
    # https://github.com/jsx-eslint/eslint-plugin-jsx-a11y/pull/1081
    eslint-plugin-jsx-a11y@6>eslint: ^10.0.0
    # Node types follow the published engines.node floor; the development tools' type peers
    # track their own runtime. Type checks pass with skipLibCheck, and nothing here ships.
    vite@8>@types/node: ~18.0.6
    vitest@5>@types/node: ~18.0.6
permissions:
  '@kitschpatrol/shared-config':
    skills: true
  tsdown:
    skills: true
publicHoistPattern:
  - '@kitschpatrol/repo-config'
  - '@kitschpatrol/typescript-config'
  - '*cspell*'
  - '*eslint*'
  - '*knip*'
  - '*mdat*'
  - '*prettier*'
  - '*remark*'
  - '*stylelint*'
  - 'case-police'
skills:
  dirs:
    - .agents/skills
